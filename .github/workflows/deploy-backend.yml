name: Deploy Selorg Dashboard Backend (Rollback Safe)

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Deploy Backend to EC2
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ubuntu
          key: ${{ secrets.EC2_SSH_KEY }}
          port: ${{ secrets.EC2_PORT }}
          script: |
            set -e

            echo "============================="
            echo "✅ BACKEND DEPLOYMENT STARTED"
            echo "============================="

            BACKEND_DIR="/home/ubuntu/selorg/selorg-dashboard-backend-v1.1"
            LOCAL_DOCKERFILE="/home/ubuntu/selorg/Dockerfiles/Dockerfile-backend"
            ENV_FILE="/home/ubuntu/selorg/envs/backend.env"

            IMAGE_NAME="selorg-backend"
            CONTAINER_NAME="selorg-backend"

            echo "➡️ Go to backend directory"
            cd $BACKEND_DIR

            echo "🧹 Clean repo & pull latest code"
            git reset --hard
            git clean -fd
            git pull origin main

            COMMIT=$(git rev-parse --short HEAD)
            NEW_IMAGE="${IMAGE_NAME}:${COMMIT}"
            LATEST_IMAGE="${IMAGE_NAME}:latest"
            BACKUP_IMAGE="${IMAGE_NAME}:backup"

            echo "📌 Backup current latest image"
            sudo docker image inspect $LATEST_IMAGE >/dev/null 2>&1 && sudo docker tag $LATEST_IMAGE $BACKUP_IMAGE || true

            echo "🐳 Build new backend image"
            sudo docker build -t $NEW_IMAGE -f $LOCAL_DOCKERFILE .

            sudo docker tag $NEW_IMAGE $LATEST_IMAGE

            echo "🛑 Remove old container"
            sudo docker stop $CONTAINER_NAME || true
            sudo docker rm $CONTAINER_NAME || true

            echo "🚀 Run new container (PRIVATE PORT)"
            sudo docker run -d \
              --name $CONTAINER_NAME \
              --restart always \
              -p 127.0.0.1:5000:5000 \
              --env-file $ENV_FILE \
              $LATEST_IMAGE

            echo "⏳ Wait for backend boot"
            sleep 8

            echo "🔍 Health check"
            if curl -f http://127.0.0.1:5000 >/dev/null 2>&1; then
              echo "✅ Backend deployed successfully!"
            else
              echo "❌ Backend failed. Rolling back..."

              sudo docker logs $CONTAINER_NAME --tail 80 || true
              sudo docker rm -f $CONTAINER_NAME || true

              if sudo docker image inspect $BACKUP_IMAGE >/dev/null 2>&1; then
                sudo docker tag $BACKUP_IMAGE $LATEST_IMAGE
                sudo docker run -d \
                  --name $CONTAINER_NAME \
                  --restart always \
                  -p 127.0.0.1:5000:5000 \
                  --env-file $ENV_FILE \
                  $LATEST_IMAGE
                echo "✅ Rollback completed"
              else
                echo "⚠️ No backup image found"
                exit 1
              fi
            fi

            sudo docker image prune -af

            echo "============================="
            echo "✅ BACKEND DEPLOYMENT FINISHED"
            echo "============================="
